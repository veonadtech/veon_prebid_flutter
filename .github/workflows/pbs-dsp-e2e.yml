name: PBS and local DSP E2E

on:
  push:
    branches: [test, feature/AD-1698-ci-cd-and-tests]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    if: ${{ false }} # Temporarily skip Android E2E while diagnosing iOS PBS startup.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: stage
      deployment: false
    steps:
      - uses: actions/checkout@v4
      - name: Check DSP access token
        env:
          DSP_E2E_TOKEN: ${{ secrets.DSP_E2E_TOKEN }}
        run: |
          if [[ -z "$DSP_E2E_TOKEN" ]]; then
            echo "Configure DSP_E2E_TOKEN with read access to dsp-bidder and its private Go modules" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: veonadtech/dsp-bidder
          ref: 1784190a80f317ae1761fe5b1ef90fd93fddd4f6
          path: dsp-bidder
          token: ${{ secrets.DSP_E2E_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build synthetic DSP runtime
        env:
          DSP_E2E_TOKEN: ${{ secrets.DSP_E2E_TOKEN }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${DSP_E2E_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          bash e2e/pbs/dsp-local/build-local.sh dsp-bidder
          go clean -cache -modcache
      - name: Start PBS-Java and DSP
        run: docker compose -f e2e/pbs/compose.yaml -f e2e/pbs/compose-dsp.yaml --profile dsp up -d
      - name: Verify live PBS to DSP auction
        run: bash e2e/pbs/java/smoke.sh
      - name: Verify DSP click redirect
        run: bash e2e/pbs/dsp-local/verify-click.sh
      - name: Reset auction audit before Flutter test
        run: curl --fail --silent --show-error --request POST http://127.0.0.1:8000/__e2e/reset
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
        working-directory: example
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: bash e2e/pbs/run-android-render.sh
      - name: Upload Android E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbs-dsp-android-render
          path: e2e/pbs/artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify Flutter request and DSP bid
        run: bash e2e/pbs/verify-app-auction.sh
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f e2e/pbs/compose.yaml -f e2e/pbs/compose-dsp.yaml --profile dsp logs --tail 120 pbs dsp audit
      - name: Stop containers
        if: always()
        run: docker compose -f e2e/pbs/compose.yaml -f e2e/pbs/compose-dsp.yaml --profile dsp down

  stage-ios:
    runs-on: macos-15-intel
    timeout-minutes: 90
    environment:
      name: stage
      deployment: false
    steps:
      - uses: actions/checkout@v4
      - name: Check DSP access token
        env:
          DSP_E2E_TOKEN: ${{ secrets.DSP_E2E_TOKEN }}
        run: |
          if [[ -z "$DSP_E2E_TOKEN" ]]; then
            echo "Configure DSP_E2E_TOKEN with read access to dsp-bidder and its private Go modules" >&2
            exit 1
          fi
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: macos-15-intel-docker-compose-v1
      - name: Install Docker CLI and Compose
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install docker docker-compose
          mkdir -p "$HOME/.docker/cli-plugins"
          ln -sfn "$(brew --prefix docker-compose)/bin/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"
      - name: Cache Lima and Colima release assets
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/lima.tar.gz
            ${{ runner.temp }}/colima
          key: macos-15-intel-lima-2.2.1-colima-0.10.3-assets-v1
      - name: Install Lima and Colima
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          download_asset() {
            local repo="$1" tag="$2" asset="$3" destination="$4" asset_id
            [[ -s "$destination" ]] && return 0
            asset_id="$(curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 90 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$repo/releases/tags/$tag" |
              jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .id')" || asset_id=
            if [[ -n "$asset_id" ]] && \
              curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 90 \
                -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
                -o "${destination}.download" \
                "https://api.github.com/repos/$repo/releases/assets/$asset_id"; then
              if validate_asset "$asset" "${destination}.download"; then
                mv "${destination}.download" "$destination"
                return 0
              fi
            fi
            echo "GitHub API download failed for $asset; trying the release URL" >&2
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 180 \
              -o "${destination}.download" \
              "https://github.com/$repo/releases/download/$tag/$asset"
            validate_asset "$asset" "${destination}.download"
            mv "${destination}.download" "$destination"
          }
          validate_asset() {
            case "$1" in
              *.tar.gz) tar -tzf "$2" >/dev/null 2>&1 ;;
              *) file -b "$2" | grep -q '^Mach-O' ;;
            esac
          }
          download_asset lima-vm/lima v2.2.1 lima-2.2.1-Darwin-x86_64.tar.gz "$RUNNER_TEMP/lima.tar.gz"
          sudo mkdir -p /usr/local/libexec
          sudo tar -xzf "$RUNNER_TEMP/lima.tar.gz" -C /usr/local
          download_asset abiosoft/colima v0.10.3 colima-Darwin-x86_64 "$RUNNER_TEMP/colima"
          sudo install -m 755 "$RUNNER_TEMP/colima" /usr/local/bin/colima
      - name: Cache Lima VM image downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/lima
          key: macos-15-intel-lima-2.2.1-colima-0.10.3
      - name: Start Colima
        run: colima start --cpu 3 --memory 6 --disk 20 --arch x86_64 --vm-type vz --mount-type virtiofs
      - name: Check iOS runner tools
        run: |
          for tool in docker xcodebuild xcrun jq; do
            command -v "$tool" >/dev/null || { echo "Missing $tool on stage-ios runner" >&2; exit 1; }
          done
          docker info >/dev/null
          docker compose version
      - name: Select Xcode 26
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          test -n "$XCODE_APP" || { echo "Xcode 26 is not installed" >&2; exit 1; }
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - uses: actions/checkout@v4
        with:
          repository: veonadtech/dsp-bidder
          ref: 1784190a80f317ae1761fe5b1ef90fd93fddd4f6
          path: dsp-bidder
          token: ${{ secrets.DSP_E2E_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build synthetic DSP runtime
        env:
          DSP_E2E_TOKEN: ${{ secrets.DSP_E2E_TOKEN }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${DSP_E2E_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          bash e2e/pbs/dsp-local/build-local.sh dsp-bidder
          go clean -cache -modcache
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          cache: true
          cache-sdk: true
      - name: Boot iOS simulator
        run: |
          DEVICE="$(xcrun simctl list --json devices booted | jq -r '[.devices[][] | select(.state == "Booted" and (.name | startswith("iPhone"))) | .udid][0] // empty')"
          if [[ -z "$DEVICE" ]]; then
            DEVICE="$(xcrun simctl list --json devices available | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .udid][0] // empty')"
            test -n "$DEVICE" || { echo "No iPhone simulator is available" >&2; exit 1; }
            xcrun simctl boot "$DEVICE"
          fi
          xcrun simctl bootstatus "$DEVICE" -b
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: Run iOS banner and click E2E
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          PBS_IOS_VERBOSE: '1'
        run: bash e2e/pbs/run-ios-render.sh "$DEVICE" 2>&1 | tee "$RUNNER_TEMP/pbs-ios-e2e.log"
      - name: Upload iOS E2E result and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbs-dsp-ios-render
          path: |
            ${{ runner.temp }}/pbs-ios-e2e.*/Result.xcresult
            ${{ runner.temp }}/pbs-ios-e2e.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f e2e/pbs/compose.yaml -f e2e/pbs/compose-dsp.yaml -f e2e/pbs/compose-ios.yaml --profile dsp logs --tail 120 pbs dsp audit
      - name: Stop containers
        if: always()
        run: docker compose -f e2e/pbs/compose.yaml -f e2e/pbs/compose-dsp.yaml -f e2e/pbs/compose-ios.yaml --profile dsp down
