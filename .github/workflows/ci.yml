name: Flutter adapter CI

on:
  pull_request:
    branches: [dev, test, main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [test]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check release path and Jira link
        if: github.event_name == 'pull_request'
        env:
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$TARGET" == dev ]]; then
            if [[ "$SOURCE" =~ ^(feature|bug|bugfix|hotfix|chore|ci|build|test|perf|refactor|sec)/([A-Za-z]+-[0-9]+)(-[A-Za-z0-9]+)*$ ]]; then
              ISSUE_KEY="${BASH_REMATCH[2]}"
            else
              echo "Use <type>/AD-123[-description] branches. Allowed types: feature, bug, bugfix, hotfix, chore, ci, build, test, perf, refactor, sec" >&2
              exit 1
            fi
          fi
          if [[ "$TARGET" == test && "$SOURCE" != dev ]]; then
            echo "Only dev may be merged into test" >&2
            exit 1
          fi
          if [[ "$TARGET" == main ]]; then
            if [[ "$SOURCE" != test || "$SOURCE_REPO" != "$GITHUB_REPOSITORY" ]]; then
              echo "Only the test branch of this repository may be merged into main" >&2
              exit 1
            fi
            for CHECK in stage candidate-tag; do
              CONCLUSION="$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs" -f per_page=100 \
                --jq "[.check_runs[] | select(.app.slug == \"github-actions\" and .name == \"$CHECK\")] | max_by(.id).conclusion")"
              if [[ "$CONCLUSION" != success ]]; then
                echo "The latest $CHECK check on test HEAD must succeed before merging into main" >&2
                exit 1
              fi
            done
          fi
          if [[ ! "$BODY" =~ https?://[^[:space:]]+/browse/[A-Za-z]+-[0-9]+ ]]; then
            echo "PR description must contain a Jira issue URL" >&2
            exit 1
          fi
          if [[ "$TARGET" == dev ]]; then
            ISSUE_URL_PATTERN="https?://[^[:space:]]+/browse/${ISSUE_KEY}([^[:alnum:]-]|$)"
            if [[ ! "$BODY" =~ $ISSUE_URL_PATTERN ]]; then
              echo "PR description must link to Jira issue $ISSUE_KEY from the branch name" >&2
              exit 1
            fi
          fi

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test

  android-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
        working-directory: example
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: cd example && flutter test integration_test/plugin_integration_test.dart --no-uninstall -d emulator-5554 -r expanded

  ios-integration:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
      - run: flutter pub get
        working-directory: example
      - name: Boot iOS simulator
        run: |
          DEVICE="$(xcrun simctl list devices available | sed -nE 's/.*(iPhone [^(]+) \(([0-9A-F-]{36})\).*/\2/p' | head -1)"
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - run: flutter test integration_test/plugin_integration_test.dart -d "$DEVICE"
        working-directory: example

  candidate-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.')
    needs: [unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify candidate tag matches test and passed stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' pubspec.yaml)"
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([1-9][0-9]*)$ ]]
          test "${BASH_REMATCH[1]}" = "$VERSION"
          git fetch origin test --depth=1
          test "$GITHUB_SHA" = "$(git rev-parse FETCH_HEAD)"
          CONCLUSION="$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" -f per_page=100 \
            --jq '[.check_runs[] | select(.app.slug == "github-actions" and .name == "stage")] | max_by(.id).conclusion')"
          if [[ "$CONCLUSION" != success ]]; then
            echo "The latest stage check on test HEAD must succeed before creating a candidate tag" >&2
            exit 1
          fi

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: [unit]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify version and main branch
        run: |
          VERSION="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' pubspec.yaml)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          git fetch origin main --depth=1
          test "$GITHUB_SHA" = "$(git rev-parse FETCH_HEAD)"
      - name: Publish release tag to production
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
